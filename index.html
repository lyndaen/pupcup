<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pup Cup Unlimited · Shareholder report</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="🐶 Pup Cup Unlimited · Shareholder report">
<meta property="og:description" content="For shareholders. Enter the passphrase to open this week's report.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* The lock page for the weekly report (owner, Oct 18). Published by tool-company-report.ts as the site's index.html;
   the report itself is encrypted in r/<date>.json (src/dashboard/publicReport.ts) and opened here in the browser. */
:root {
  --bg: #fbf3e4; --dot: #e9dcc2; --panel: #ffffff; --ink: #111111; --muted: #5a5560; --line: #111111;
  --accent: #ffd23f; --on-accent: #111111; --bad: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18171c; --dot: #26242c; --panel: #232129; --ink: #f7f2e7; --muted: #c9c3cf; --line: #f7f2e7;
    --accent: #ffd23f; --on-accent: #111111; --bad: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #18171c; --dot: #26242c; --panel: #232129; --ink: #f7f2e7; --muted: #c9c3cf; --line: #f7f2e7;
  --accent: #ffd23f; --on-accent: #111111; --bad: #ff8a80;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg) radial-gradient(var(--dot) 1.2px, transparent 1.2px) 0 0 / 18px 18px; color: var(--ink);
  font: 16px/1.45 "Space Grotesk", system-ui, "Segoe UI", sans-serif; }
.card { width: 100%; max-width: 380px; background: var(--panel); border: 3px solid var(--line); border-radius: 14px;
  padding: 22px 20px; box-shadow: 6px 6px 0 var(--line); }
.logo { font-size: 44px; line-height: 1; }
h1 { font-size: 22px; margin: 8px 0 2px; }
.sub { color: var(--muted); margin: 0 0 18px; }
label { display: block; font-weight: 700; margin-bottom: 6px; }
input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); }
.row { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; color: var(--muted); font-size: 14px; }
.row input { width: 18px; height: 18px; accent-color: var(--accent); }
button { width: 100%; font: inherit; font-weight: 700; padding: 11px; border: 2px solid var(--line); border-radius: 8px;
  background: var(--accent); color: var(--on-accent); cursor: pointer; box-shadow: 3px 3px 0 var(--line); }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--bad); font-weight: 700; margin: 12px 0 0; min-height: 1.4em; }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="logo" aria-hidden="true">🐶</div>
  <h1>Pup Cup Unlimited</h1>
  <p class="sub" id="sub">Shareholder report</p>
  <label for="pw">Passphrase</label>
  <input type="password" id="pw" autocomplete="current-password" required>
  <div class="row"><input type="checkbox" id="keep" checked><label for="keep" style="margin:0;font-weight:500">Remember on this device</label></div>
  <button type="submit" id="go">Open the report</button>
  <p class="err" id="err" role="alert"></p>
</form>
<script>
// All in one function: document.write keeps this window, so top-level names here (like $) would clash with the
// report's own script and stop it loading (Oct 18: the first report sat on "loading…").
(() => {
const $ = (id) => document.getElementById(id);
const day = new URLSearchParams(location.search).get("d");
const file = /^\d{4}-\d{2}-\d{2}$/.test(day || "") ? `r/${day}.json` : "latest.json";
if (file !== "latest.json") $("sub").textContent = `Shareholder report · ${new Date(`${day}T12:00:00`).toLocaleDateString([], { month: "long", day: "numeric", year: "numeric" })}`;
const KEY = "pupcup-pass";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function unlock(pass) {
  const res = await fetch(file, { cache: "no-store" });
  if (!res.ok) throw new Error(res.status === 404 ? "That report isn't there (yet). Try again in a minute." : `Couldn't load it (HTTP ${res.status}).`);
  const s = await res.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(s.salt), iterations: s.iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(s.iv) }, key, b64(s.ct)); }
  catch { throw new Error("That passphrase didn't work."); }
  return new TextDecoder().decode(plain);
}

async function attempt(pass, remember) {
  $("go").disabled = true; $("err").textContent = ""; $("go").textContent = "Opening…";
  try {
    const html = await unlock(pass);
    try { if (remember) localStorage.setItem(KEY, pass); } catch { /* private window */ }
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { if (/passphrase/.test(e.message)) localStorage.removeItem(KEY); } catch { /* private window */ }
    $("err").textContent = e.message; $("go").disabled = false; $("go").textContent = "Open the report";
  }
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); attempt($("pw").value, $("keep").checked); });
// A passphrase in the link's #k=… (never sent to the server) opens it straight away; it's then cleared from the address.
const fromLink = new URLSearchParams(location.hash.slice(1)).get("k");
if (fromLink) history.replaceState(null, "", location.pathname + location.search);
let saved = null;
try { saved = localStorage.getItem(KEY); } catch { /* private window */ }
if (fromLink || saved) attempt(fromLink || saved, true);
})();
</script>
</body>
</html>
